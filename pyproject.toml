[project]
name = "nl-2-sql-vanna-oracle-pc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.1.0",
    "oracledb>=2.0.0",
    "python-dotenv>=1.1.0",
    "sqlglot>=30.8.0",
    "vanna[fastapi,httpx,ollama]>=2.0.2",
    "watchfiles>=1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nl_2_sql_vanna_oracle_pc = ["ui/static/*", "ui/templates/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
